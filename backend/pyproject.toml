[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clipsmith-backend"
version = "0.1.0"
description = "Raw recording -> tight main video + vertical shorts (Whisper + LLM + FFmpeg)"
requires-python = ">=3.11"
dynamic = ["dependencies"]            # requirements.txt is the single list; the desktop app installs from it too

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
clipsmith = "clipsmith.cli:main"
clipsmith-serve = "clipsmith.serve:main"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]
